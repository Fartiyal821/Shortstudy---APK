name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with System Gradle
        run: |
          # ऑटोमैटिक उस फोल्डर में जाएं जहाँ main build.gradle मौजूद है
          TARGET_DIR=$(find . -maxdepth 3 -name "build.gradle*" -not -path "*/app/*" -exec dirname {} \; | head -n 1)
          echo "Building project in: $TARGET_DIR"
          cd "$TARGET_DIR"
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShortStudy-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
