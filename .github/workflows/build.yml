name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # 1. Main Project Directory ढूँढें
          TARGET_DIR=$(find . -maxdepth 3 -name "build.gradle*" -not -path "*/app/*" -exec dirname {} \; | head -n 1)
          echo "Building project in: $TARGET_DIR"
          cd "$TARGET_DIR"

          # 2. Missing .env.example / .env फाइलें क्रिएट करें
          touch .env.example .env

          # 3. Foojay Plugin को हटाएं (जो CI पर इश्यू दे सकता है)
          if [ -f "settings.gradle" ]; then
            sed -i '/foojay/d' settings.gradle
          fi
          if [ -f "settings.gradle.kts" ]; then
            sed -i '/foojay/d' settings.gradle.kts
          fi

          # 4. APK बिल्ड शुरू करें
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShortStudy-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
